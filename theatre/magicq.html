<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChamSys MagicQ Guide | Duckers Theatre</title>
    <!-- Tailwind CSS for Light Blue Theme -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js for zero-JS-fiddling interactivity -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased" x-data="tutorialApp()">

    <!-- Top Navigation Bar -->
    <header class="sticky top-0 z-30 flex h-16 w-full items-center justify-between border-b border-blue-100 bg-white px-4 shadow-sm sm:px-6">
        <div class="flex items-center gap-3">
            <!-- Hamburger Menu Button (Mobile) -->
            <button @click="sidebarOpen = !sidebarOpen" class="rounded p-1.5 text-purple-600 hover:bg-blue-50 lg:hidden" aria-label="Toggle menu">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <span class="font-bold text-lg text-blue-900 tracking-tight">ChamSys MagicQ Guide</span>
        </div>
        <!-- Progress Indicator Badge -->
        <div class="text-xs font-semibold bg-blue-50 text-blue-900 px-3 py-1.5 rounded-full border border-blue-200">
            Progress: <span x-text="steps.length > 1 ? Math.round((currentStep / (steps.length - 1)) * 100) : 0"></span>%
        </div>
    </header>

    <div class="flex min-h-[calc(100vh-4rem)]">
        <!-- Collapsible Sidebar Navigation -->
        <aside :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'" class="fixed inset-y-0 left-0 z-40 mt-16 w-64 border-r border-blue-100 bg-white p-4 transition-transform duration-200 ease-in-out lg:sticky lg:top-16 lg:h-[calc(100vh-4rem)] lg:translate-x-0">
            <nav class="space-y-1">
                <p class="px-3 text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Modules</p>
                <template x-for="(step, index) in steps" :key="index">
                    <button @click="setStep(index); sidebarOpen = false;" :class="currentStep === index ? 'bg-violet-600 text-white font-medium' : 'text-slate-600 hover:bg-blue-50 hover:text-blue-700'" class="flex w-full items-center rounded-lg px-3 py-2.5 text-left text-sm transition-colors">
                        <span class="mr-2 flex h-5 w-5 shrink-0 items-center justify-center rounded-full text-xs border transition-colors" :class="currentStep === index ? 'bg-white border-transparent text-violet-600 font-bold' : 'border-slate-300 text-slate-500'" x-text="index === 0 ? '★' : index"></span>
                        <span class="truncate" x-text="step.title"></span>
                    </button>
                </template>
            </nav>
            <!-- Reset Button in Sidebar -->
            <div class="absolute bottom-4 left-4 right-4 pt-4 border-t border-slate-100">
                <button @click="resetProgress()" class="w-full text-center text-xs text-rose-500 hover:text-rose-700 font-medium py-2 rounded hover:bg-rose-50 transition-colors">
                    Reset Saved Progress
                </button>
            </div>
        </aside>

        <!-- Overlay for Mobile Sidebar -->
        <div x-show="sidebarOpen" @click="sidebarOpen = false" x-cloak class="fixed inset-0 z-30 bg-slate-900/40 backdrop-blur-sm lg:hidden"></div>

        <!-- Main Content Area -->
        <main class="flex-1 p-4 sm:p-6 lg:p-10 max-w-4xl mx-auto w-full">
            <article class="bg-white border border-blue-100 p-6 sm:p-8 rounded-xl shadow-sm">
                <!-- Dynamic Header Layout based on Step Type -->
                <div class="mb-6">
                    <span x-show="steps[currentStep] && steps[currentStep].type !== 'start'" class="text-xs font-bold uppercase tracking-wider text-blue-800" x-text="'Step ' + currentStep + ' of ' + (steps.length - 1)"></span>
                    <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-1" x-text="steps[currentStep] ? steps[currentStep].title : ''"></h1>
                </div>

                <!-- Step Narrative Text -->
                <div class="prose prose-slate max-w-none text-slate-600 leading-relaxed text-sm sm:text-base space-y-4" x-html="steps[currentStep] ? steps[currentStep].content : ''"></div>

                <!-- Conditional Image Block -->
                <template x-if="steps[currentStep] && steps[currentStep].image">
                    <div class="mt-8 overflow-hidden rounded-xl border border-slate-200 bg-slate-100">
                        <img :src="steps[currentStep].image" :alt="steps[currentStep].title" class="w-full h-auto object-cover max-h-[400px]" />
                    </div>
                </template>

                <!-- Dynamic Bottom Footer Navigation Controls -->
                <div class="mt-10 flex flex-col sm:flex-row items-center justify-between gap-4 border-t border-slate-100 pt-6">
                    <!-- Previous Button -->
                    <button @click="setStep(currentStep - 1)" :disabled="currentStep === 0" :class="currentStep === 0 ? 'invisible' : 'text-blue-600 hover:bg-blue-50 border-blue-200'" class="flex w-full sm:w-auto items-center justify-center gap-2 border px-5 py-3 text-sm font-semibold transition-all rounded-lg">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                        Previous Step
                    </button>
                    <!-- Next Button -->
                    <button @click="setStep(currentStep + 1)" x-show="currentStep < steps.length - 1" class="flex w-full sm:w-auto items-center justify-center gap-2 bg-blue-800 px-6 py-3 text-sm font-semibold text-white hover:bg-indigo-600 transition-all rounded-lg">
                        Next Step
                    </button>
                </div>
            </article>
        </main>
    </div>

    <!-- Isolated App Scripts -->
    <script>
        function tutorialApp() {
            return {
                sidebarOpen: false,
                currentStep: parseInt(localStorage.getItem('magicq_tutorial_step')) || 0,
                steps: [
                    { 
                        title: 'Welcome to MagicQ!', 
                        type: 'start', 
                        content: 'Welcome to this rather badly designed (web, not the actual content) tutorial on how to program Chamsys MagicQ! These instructions work for both desk and PC software, and is intended to give schools, students, people who have been voulenteered to do wedding lighting, and maybe even your Dad\'s friend James a rough idea on how to control some lights using Chamsys MagicQ. Fun! <br><br> Now, you could just read the official Chamsys docs, and if you want to, go ahead - however, they are way to brilliant - they go in depth about everything. This guide is designed to get you up and running with some funky light shows quickly-ish. <br><br> Good Luck! May the DMX channel limit be ever with you.', 
                        image: '' 
                    },
                    { 
                        title: 'Step 1: Actually Getting MagicQ', 
                        type: 'step', 
                        content: '<b class="text-red-600">Ignore this if your on a desk (lucky you!)</b> <br>A very good place to start! Simply head to ChamSys and pop to the MagicQ Downloads Page, enter some details, and run the downloaded installer. Once you have done that, launch the MagicQ (not MagicQ Vis or Magic HD) application (sometimes called mqqt.exe). You should see something that looks like this. Press "Simple Generic Console (Chase)"', 
                        image: 'https://unsplash.com' 
                    },
                    { 
                        title: 'Step 2: Patching Lights (pt 1)', 
                        type: 'step', 
                        content: 'Ok. People who have a desk and went to sleep, WAKE UP NOW!! Awake? Good. <br> So, now we have MagicQ running, we need to tell it what lights we have, and what DMX channel they are on. To understand this, you need to understand that:<ul class="list-disc pl-5 mt-2"><li>Each light has a DMX address, from 1-512.</li><li>They use up channels for things like Red, Green, Blue, Dimmer, Pan, Tilt and Gobo - so one light could take up channels 1 - 10, each one controlling a different attribute.</li><li>There are 512 DMX channels in a universe, and the MagicQ USB to DMX outputs 1 universe</li><li>You can Dasiy Chain lights by plugging cables into the DMX In and DMX Out on the back of the lights. It doesn\'t matter what order this is done in - you can address them however you want. </li><li>You need 1 DMX output (The DMX-USB provides 1) per universe (512 Channels)</li></ul><br>It may seem really complex, but its really useful to actually understand what data is going where.', 
                        image: '' 
                    },
                    { 
                        title: 'Step 3: Making the lights ... well .... have some light :) (Patching pt2)', 
                        type: 'step', 
                        content: 'Ok, back to MagicQ. So now you understand how the lights "talk" to Chamsys, we need to get them having a little chat (ok, that was really patronizing, sorry about that). To do this, press the "Patch" button on your console/screen, shown by red box in the picture below (if I remember to put one on it). Once you\'ve done that, press Next Step. ', 
                        image: 'https://unsplash.com' 
                    },
                    { 
                        title: 'Step 4: Patching pt3 (even though its step 4...)', 
                        type: 'step', 
content: 'Now would be a great moment to check what your lights are called, and set them to a DMX starting address. This can usually be done by cyling till the  screen on the light shows Addr, pressing Enter, and then using Up/Down. If you are using multiple lights (fancy!) make sure they are not using the same channels. So if I have a light on DMX address 1, and it uses 10 Channels, it will use channels 1-10. So the next light starts on 11. #MathsIsSometimesUsefulKids!. After you\'ve done that, press "Choose Head" (we are back in MgaicQ now, you have just pressed patch, yes?) and find  the head manufactueruer, then the name of the light. You can also use search by pressing .... guess what? Search! (followed by Search It in the top bar once you have entered your term). Once you have chosen your light, a keypad will pop up.<br> <br><b>Don\'t panic!!</b><br><br> What its asking you to type is: Number of Heads, Then an @ symbol, then the universe you want the heads on, then the Starting Channel. So if I had 1 light, on  universe 1, starting on channel 1, I would type 1@1-1. If I had 2 heads (slang for lights, or moving heads), on universe 3, starting on channel 163, I would type 2@3-163. You should be rewarded with a window showing that your light exists, in a table-style format. ',
image: ''
},
{
title: 'Step 5',
type: 'step',
content: 'Whoops! Have not wrote this yet!',
image: ''
},
{
title: 'Step 6',
type: 'step',
content: 'Whoops! Have not wrote this yet!',
image: ''
}
],
setStep(index) {
if (index >= 0 && index < this.steps.length) {
this.currentStep = index;
localStorage.setItem('magicq_tutorial_step', index);
window.scrollTo({top: 0, behavior: 'smooth'});
}
},
resetProgress() {
if(confirm('Reset all progress?')) {
this.setStep(0);
}
}
}
}
</script>
