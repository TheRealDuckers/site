<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>QR Code Generator</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- QR Code library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          boxShadow: {
            glow: "0 0 50px rgba(99, 102, 241, 0.18)"
          }
        }
      }
    };
  </script>
</head>

<body class="min-h-screen bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-white">

  <main class="mx-auto max-w-6xl px-4 py-8 sm:px-6 lg:px-8">

    <!-- Generator header -->
    <header id="generatorHeader" class="mb-8 text-center">
      <div class="mb-4 inline-flex items-center gap-2 rounded-full border border-indigo-200 bg-indigo-50 px-4 py-2 text-sm font-medium text-indigo-700 dark:border-indigo-900 dark:bg-indigo-950/50 dark:text-indigo-300">
        QR Code Generator
      </div>

      <h1 class="text-4xl font-black tracking-tight sm:text-5xl">
        Create a QR code
      </h1>

      <p class="mx-auto mt-3 max-w-xl text-slate-600 dark:text-slate-400">
        Generate a customizable QR code for links, text, contact details, and more.
      </p>
    </header>

    <!-- Generator interface -->
    <div
      id="generatorInterface"
      class="overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-xl dark:border-slate-800 dark:bg-slate-900"
    >
      <div class="grid lg:grid-cols-[1fr_0.9fr]">

        <!-- Settings -->
        <section class="p-6 sm:p-8">
          <div class="mb-6">
            <h2 class="text-xl font-bold">Customize your QR code</h2>
            <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
              Adjust the content and appearance below.
            </p>
          </div>

          <div class="space-y-5">
            <div>
              <label for="code" class="mb-2 block text-sm font-semibold">
                Text or URL
              </label>

              <textarea
                id="code"
                rows="4"
                placeholder="https://example.com"
                class="w-full resize-y rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-sm outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 dark:border-slate-700 dark:bg-slate-950"
              ></textarea>
            </div>

            <div>
              <label for="title" class="mb-2 block text-sm font-semibold">
                Title
                <span class="font-normal text-slate-400">(optional)</span>
              </label>

              <input
                id="title"
                type="text"
                placeholder="Scan me"
                class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-sm outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 dark:border-slate-700 dark:bg-slate-950"
              />
            </div>

            <div class="grid gap-5 sm:grid-cols-2">
              <div>
                <label for="size" class="mb-2 block text-sm font-semibold">
                  Size
                </label>

                <input
                  id="size"
                  type="number"
                  min="100"
                  max="2000"
                  value="300"
                  class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-sm outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 dark:border-slate-700 dark:bg-slate-950"
                />
              </div>

              <div>
                <label for="margin" class="mb-2 block text-sm font-semibold">
                  Margin
                </label>

                <input
                  id="margin"
                  type="number"
                  min="0"
                  max="50"
                  value="4"
                  class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-sm outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 dark:border-slate-700 dark:bg-slate-950"
                />
              </div>
            </div>

            <div>
              <label for="ecc" class="mb-2 block text-sm font-semibold">
                Error correction
              </label>

              <select
                id="ecc"
                class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-sm outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 dark:border-slate-700 dark:bg-slate-950"
              >
                <option value="L">Low — 7%</option>
                <option value="M" selected>Medium — 15%</option>
                <option value="Q">Quartile — 25%</option>
                <option value="H">High — 30%</option>
              </select>
            </div>

            <div class="grid grid-cols-2 gap-5">
              <div>
                <label for="dark" class="mb-2 block text-sm font-semibold">
                  QR color
                </label>
                <input
                  id="dark"
                  type="color"
                  value="#000000"
                  class="h-11 w-full cursor-pointer rounded-xl border border-slate-300 bg-slate-50 p-1 dark:border-slate-700 dark:bg-slate-950"
                />
              </div>

              <div>
                <label for="light" class="mb-2 block text-sm font-semibold">
                  Background
                </label>
                <input
                  id="light"
                  type="color"
                  value="#ffffff"
                  class="h-11 w-full cursor-pointer rounded-xl border border-slate-300 bg-slate-50 p-1 dark:border-slate-700 dark:bg-slate-950"
                />
              </div>
            </div>

            <button
              id="downloadButton"
              type="button"
              class="w-full rounded-xl bg-indigo-600 px-5 py-3.5 text-sm font-bold text-white transition hover:bg-indigo-700"
            >
              Download PNG
            </button>
          </div>
        </section>

        <!-- Preview -->
        <section class="flex min-h-[500px] flex-col items-center justify-center bg-gradient-to-br from-indigo-50 via-white to-purple-50 p-6 dark:from-indigo-950/30 dark:via-slate-900 dark:to-purple-950/30">
          <p class="mb-6 text-xs font-bold uppercase tracking-[0.2em] text-indigo-600 dark:text-indigo-400">
            Live preview
          </p>

          <div class="w-full max-w-sm rounded-3xl border border-white/80 bg-white/80 p-6 shadow-xl dark:border-slate-700/80 dark:bg-slate-800/80">
            <h2 id="titlePreview" class="mb-5 break-words text-center text-xl font-bold"></h2>

            <div class="flex min-h-[260px] items-center justify-center overflow-auto rounded-2xl bg-white p-4">
              <div id="qrcode">
                <span class="text-sm text-slate-400">
                  Your QR code will appear here
                </span>
              </div>
            </div>
          </div>
        </section>

      </div>
    </div>

    <!-- Display-only QR page -->
    <div
      id="standaloneQr"
      class="hidden min-h-[calc(100vh-4rem)] flex-col items-center justify-center text-center"
    >
      <h1
        id="standaloneTitle"
        class="mb-6 max-w-xl break-words text-3xl font-black tracking-tight sm:text-5xl"
      ></h1>

      <div class="rounded-3xl bg-white p-5 shadow-2xl">
        <div id="standaloneQrCode"></div>
      </div>
    </div>

  </main>

  <script>
    const params = new URLSearchParams(window.location.search);

    const fields = {
      code: document.getElementById("code"),
      title: document.getElementById("title"),
      size: document.getElementById("size"),
      ecc: document.getElementById("ecc"),
      dark: document.getElementById("dark"),
      light: document.getElementById("light"),
      margin: document.getElementById("margin")
    };

    const titlePreview = document.getElementById("titlePreview");
    const qrContainer = document.getElementById("qrcode");
    const downloadButton = document.getElementById("downloadButton");

    const generatorHeader = document.getElementById("generatorHeader");
    const generatorInterface = document.getElementById("generatorInterface");
    const standaloneQr = document.getElementById("standaloneQr");
    const standaloneTitle = document.getElementById("standaloneTitle");
    const standaloneQrCode = document.getElementById("standaloneQrCode");

    function normalizeHexColor(value, fallback) {
      return /^#[0-9a-f]{6}$/i.test(value) ? value : fallback;
    }

    function getOptions() {
      return {
        code: params.get("code") || "",
        title: params.get("title") || "",
        size: Math.max(100, Math.min(2000, Number(params.get("size")) || 300)),
        margin: Math.max(0, Math.min(50, Number(params.get("margin")) || 4)),
        dark: normalizeHexColor(params.get("dark"), "#000000"),
        light: normalizeHexColor(params.get("light"), "#ffffff"),
        ecc: params.get("ecc") || "M"
      };
    }

    function createQr(element, options) {
      element.innerHTML = "";
      element.style.padding = `${options.margin}px`;

      new QRCode(element, {
        text: options.code,
        width: options.size,
        height: options.size,
        colorDark: options.dark,
        colorLight: options.light,
        correctLevel:
          QRCode.CorrectLevel[options.ecc] ||
          QRCode.CorrectLevel.M
      });
    }

    function generateEditorQr() {
      const code = fields.code.value.trim();

      titlePreview.textContent = fields.title.value.trim();
      qrContainer.innerHTML = "";

      if (!code) {
        qrContainer.innerHTML = `
          <span class="text-sm text-slate-400">
            Your QR code will appear here
          </span>
        `;
        return;
      }

      createQr(qrContainer, {
        code,
        title: fields.title.value.trim(),
        size: Math.max(100, Math.min(2000, Number(fields.size.value) || 300)),
        margin: Math.max(0, Math.min(50, Number(fields.margin.value) || 4)),
        dark: normalizeHexColor(fields.dark.value, "#000000"),
        light: normalizeHexColor(fields.light.value, "#ffffff"),
        ecc: fields.ecc.value
      });
    }

    function downloadQRCode() {
      const canvas = qrContainer.querySelector("canvas");
      const image = qrContainer.querySelector("img");

      const dataUrl = canvas
        ? canvas.toDataURL("image/png")
        : image
          ? image.src
          : null;

      if (!dataUrl) return;

      const link = document.createElement("a");
      link.href = dataUrl;
      link.download = "qr-code.png";
      link.click();
    }

    function showStandaloneQr() {
      const options = getOptions();

      document.title = options.title || "QR Code";

      generatorHeader.classList.add("hidden");
      generatorInterface.classList.add("hidden");

      standaloneQr.classList.remove("hidden");
      standaloneQr.classList.add("flex");

      standaloneTitle.textContent = options.title;
      standaloneQrCode.style.backgroundColor = options.light;

      createQr(standaloneQrCode, options);
    }

    function showGenerator() {
      for (const [name, element] of Object.entries(fields)) {
        if (params.has(name)) {
          element.value = params.get(name);
        }
      }

      if (params.has("text")) {
        fields.code.value = params.get("text");
      }

      if (params.has("color")) {
        fields.dark.value = params.get("color");
      }

      if (params.has("background")) {
        fields.light.value = params.get("background");
      }

      Object.values(fields).forEach((field) => {
        field.addEventListener("input", generateEditorQr);
        field.addEventListener("change", generateEditorQr);
      });

      downloadButton.addEventListener("click", downloadQRCode);

      generateEditorQr();
    }

    // If ?code= exists, show only the QR code.
    if (params.has("code") && params.get("code").trim() !== "") {
      showStandaloneQr();
    } else {
      showGenerator();
    }
  </script>
</body>
</html>
